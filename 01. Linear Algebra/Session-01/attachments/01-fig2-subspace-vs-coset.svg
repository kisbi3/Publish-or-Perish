<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="620" height="380" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="310" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">
    Subspace W = span({u, v}) vs. Coset A + W
  </text>

  <!-- 3D Axes -->
  <line x1="180" y1="240" x2="180" y2="45" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="180" y1="240" x2="440" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="180" y1="240" x2="55" y2="325" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Subspace Plane W through Origin -->
  <polygon points="70,270 240,285 360,195 190,180" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.5"/>

  <!-- Basis vectors u, v in W -->
  <line x1="180" y1="240" x2="268" y2="248" stroke="#0d9488" stroke-width="2.4" marker-end="url(#arrow-teal)"/>
  <text x="235" y="268" font-family="serif" font-style="italic" font-weight="bold" font-size="15" fill="#0f766e">u</text>
  <line x1="180" y1="240" x2="232" y2="202" stroke="#0d9488" stroke-width="2.4" marker-end="url(#arrow-teal)"/>
  <text x="195" y="206" font-family="serif" font-style="italic" font-weight="bold" font-size="15" fill="#0f766e">v</text>

  <!-- Origin Point -->
  <circle cx="180" cy="240" r="4" fill="#0f172a"/>
  <text x="156" y="254" font-family="serif" font-weight="bold" font-size="15" fill="#0f172a">0</text>

  <!-- Subspace Label (Right Side Badge) -->
  <rect x="365" y="245" width="235" height="32" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="375" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#065f46">
    W = span({u, v}) (부분공간 ⭕)
  </text>

  <!-- Vector A (Translation vector) -->
  <line x1="180" y1="240" x2="180" y2="120" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="156" y="145" font-family="serif" font-style="italic" font-weight="bold" font-size="16" fill="#dc2626">A</text>

  <!-- Shifted Plane A + W (Coset / Affine Plane) -->
  <polygon points="70,150 240,165 360,75 190,60" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Coset Label (Right Side Badge) -->
  <rect x="365" y="65" width="235" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="375" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">
    A + W (부분공간 ❌: 0 ∉ 평면)
  </text>
  <text x="375" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#3b82f6">
    = {A + su + tv : s, t ∈ F}
  </text>

  <!-- Bottom Explanatory Caption -->
  <text x="310" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="middle">
    원점(0)을 포함하는 초록 평면(W)만 부분공간이며, 평행이동된 파란 평면(A+W)은 영벡터를 포함하지 않아 부분공간이 아님
  </text>
</svg>
